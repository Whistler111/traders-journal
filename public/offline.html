<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#6159ba" />
    <title>You're offline — Trade Notes</title>
    <script src="/theme.js"></script>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        background: #f7f7fb;
        color: #25283d;
      }
      html[data-theme="dark"] {
        background: #171923;
        color: #ececf6;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      h1 {
        font-size: 1.7rem;
        letter-spacing: -0.04em;
      }
      p {
        opacity: 0.7;
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        background: #6159ba;
        border-radius: 10px;
        color: white;
        text-decoration: none;
        margin-top: 18px;
      }
      a:focus-visible {
        outline: 3px solid #b0a5f0;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        Your journal will be here when you're connected again. Reconnect to load
        and save your trades.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
